name: Poly-Duel 24/7 Pre-Match Arb Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: poly-duel-arb-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate and Prepare Repository Target
        id: repo_prep
        env:
          RAW_REPO: ${{ secrets.PRIVATE_REPO_NAME || vars.PRIVATE_REPO_NAME }}
          HAS_TOKEN: ${{ (secrets.PRIVATE_REPO_TOKEN != '' || vars.PRIVATE_REPO_TOKEN != '') && 'true' || 'false' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ -n "$RAW_REPO" ]; then
            CLEAN_REPO=$(echo "$RAW_REPO" | sed -e 's|https://github.com/||g' -e 's|http://github.com/||g' -e 's|\.git$||g' -e 's|^/||g' -e 's|/$||g')
            echo "target_repo=$CLEAN_REPO" >> $GITHUB_OUTPUT
            echo "use_custom_repo=true" >> $GITHUB_OUTPUT
            echo "✅ Configured to checkout repository: $CLEAN_REPO"
          else
            echo "target_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "use_custom_repo=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Using default repository checkout: ${{ github.repository }}"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_prep.outputs.target_repo }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || vars.PRIVATE_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright playwright-stealth python-dotenv requests pyotp python-dateutil tzdata aiohttp py-clob-client
          fi
          python -m playwright install --with-deps chromium

      - name: Check Skip Job
        id: check_skip
        env:
          SKIP_JOB_ENV: ${{ secrets.SKIP_JOB || vars.SKIP_JOB }}
        run: |
          should_skip="false"
          if [ -f .env ]; then
            if grep -q "SKIP_JOB=true" .env; then
              should_skip="true"
            fi
          fi
          if [ "$SKIP_JOB_ENV" == "true" ]; then
            should_skip="true"
          fi
          echo "should_skip=$should_skip" >> $GITHUB_OUTPUT
          if [ "$should_skip" == "true" ]; then
            echo "⚠️ Job is configured to be skipped."
          fi

      - name: Write auth_state.json from secret
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
        run: |
          if [ -n "$AUTH_STATE_JSON" ]; then
            echo "$AUTH_STATE_JSON" > auth_state.json
            echo "✅ auth_state.json restored from secret."
          fi

      - name: Restore & Decrypt Persistent Data & Profile Cache
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            worker_data.json.gpg
            playwright_user_data.zip.gpg
          key: persistent-poly-duel-${{ github.run_number }}
          restore-keys: |
            persistent-poly-duel-
            persistent-data-arb-

      - name: Decrypt Persistent Data
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            if [ -f worker_data.json.gpg ]; then
              gpg --quiet --batch --yes --decrypt --passphrase "$GPG_PASSPHRASE" \
              --output worker_data.json worker_data.json.gpg || true
              echo "✅ Decrypted worker_data.json"
            fi
            if [ -f playwright_user_data.zip.gpg ]; then
              gpg --quiet --batch --yes --decrypt --passphrase "$GPG_PASSPHRASE" \
              --output playwright_user_data.zip playwright_user_data.zip.gpg || true
              if [ -f playwright_user_data.zip ]; then
                unzip -q -o playwright_user_data.zip || true
                echo "✅ Decrypted and restored browser profile"
              fi
            fi
          fi

      - name: Run Poly-Duel Pre-Match Arbitrage Engine
        if: steps.check_skip.outputs.should_skip != 'true'
        id: run_engine
        env:
          EXECUTION_MODE: ${{ secrets.EXECUTION_MODE || vars.EXECUTION_MODE || 'ALERT_ONLY' }}
          TESTING: ${{ secrets.TESTING || vars.TESTING || 'false' }}
          HEADLESS_MODE: 'false'
          MAX_RUNTIME_HOURS: ${{ secrets.MAX_RUNTIME_HOURS || vars.MAX_RUNTIME_HOURS || '4.5' }}
          SCAN_INTERVAL_SECONDS: ${{ secrets.SCAN_INTERVAL_SECONDS || vars.SCAN_INTERVAL_SECONDS || '30' }}
          SILENT_SCAN: ${{ secrets.SILENT_SCAN || vars.SILENT_SCAN || 'true' }}
          MIN_ARB_THRESHOLD: ${{ secrets.MIN_ARB_THRESHOLD || vars.MIN_ARB_THRESHOLD || '1.0' }}
          MAX_ARB_THRESHOLD: ${{ secrets.MAX_ARB_THRESHOLD || vars.MAX_ARB_THRESHOLD || '15.0' }}
          MAX_ODDS_AGE_SECONDS: ${{ secrets.MAX_ODDS_AGE_SECONDS || vars.MAX_ODDS_AGE_SECONDS || '60.0' }}
          ARB_COOLDOWN_SECONDS: ${{ secrets.ARB_COOLDOWN_SECONDS || vars.ARB_COOLDOWN_SECONDS || '900' }}
          TOTAL_STAKE_AMOUNT: ${{ secrets.TOTAL_STAKE_AMOUNT || vars.TOTAL_STAKE_AMOUNT || '50.0' }}
          MIN_BALANCE: ${{ secrets.MIN_BALANCE || vars.MIN_BALANCE || '10.0' }}
          SIMULATE_BET_PLACEMENT: ${{ secrets.SIMULATE_BET_PLACEMENT || vars.SIMULATE_BET_PLACEMENT || 'false' }}
          # Duel Credentials & 2FA
          DUEL_USERNAME: ${{ secrets.DUEL_USERNAME || secrets.SITE_USERNAME || vars.DUEL_USERNAME || vars.SITE_USERNAME }}
          DUEL_PASSWORD: ${{ secrets.DUEL_PASSWORD || secrets.SITE_PASSWORD || vars.DUEL_PASSWORD || vars.SITE_PASSWORD }}
          DUEL_AUTH_SECRET: ${{ secrets.DUEL_AUTH_SECRET || secrets.GOOGLE_AUTH_SECRET || vars.DUEL_AUTH_SECRET || vars.GOOGLE_AUTH_SECRET }}
          DUEL_BRAND_ID: ${{ secrets.DUEL_BRAND_ID || vars.DUEL_BRAND_ID || '2482975601191952386' }}
          DUEL_SPORTS_URL: ${{ secrets.DUEL_SPORTS_URL || vars.DUEL_SPORTS_URL || 'https://duel.com/sports' }}
          DUEL_CURRENCY: ${{ secrets.DUEL_CURRENCY || vars.DUEL_CURRENCY || 'USDT' }}
          # Polymarket Credentials & CLOB Key
          POLY_HOST: ${{ secrets.POLY_HOST || vars.POLY_HOST || 'https://clob.polymarket.com' }}
          POLY_GAMMA_API: ${{ secrets.POLY_GAMMA_API || vars.POLY_GAMMA_API || 'https://gamma-api.polymarket.com' }}
          POLY_CHAIN_ID: ${{ secrets.POLY_CHAIN_ID || vars.POLY_CHAIN_ID || '137' }}
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY || secrets.PK || vars.POLY_PRIVATE_KEY || vars.PK }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER || secrets.POLY_ADDRESS || vars.POLY_FUNDER || vars.POLY_ADDRESS }}
          POLY_API_KEY: ${{ secrets.POLY_API_KEY || vars.POLY_API_KEY }}
          POLY_API_SECRET: ${{ secrets.POLY_API_SECRET || vars.POLY_API_SECRET }}
          POLY_PASSPHRASE: ${{ secrets.POLY_PASSPHRASE || vars.POLY_PASSPHRASE }}
          # Proxy settings (Supports both repository Secrets and Variables)
          USE_PROXY: ${{ secrets.USE_PROXY || vars.USE_PROXY || '' }}
          PROXY_IP: ${{ secrets.PROXY_IP || vars.PROXY_IP }}
          PROXY_PORT: ${{ secrets.PROXY_PORT || vars.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME || vars.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD || vars.PROXY_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL || vars.PROXY_URL }}
          # Notifications, Output Logs & Timezone
          ENABLE_CONSOLE_LOGS: ${{ secrets.ENABLE_CONSOLE_LOGS != '' && secrets.ENABLE_CONSOLE_LOGS || vars.ENABLE_CONSOLE_LOGS || 'true' }}
          ENABLE_DISCORD_ALERTS: ${{ secrets.ENABLE_DISCORD_ALERTS != '' && secrets.ENABLE_DISCORD_ALERTS || vars.ENABLE_DISCORD_ALERTS || 'true' }}
          LOGS_WEBHOOK_URL: ${{ secrets.LOGS_WEBHOOK_URL || vars.LOGS_WEBHOOK_URL || secrets.GH_SECRETS_LOGS_WEBHOOK_URL || vars.GH_VARS_LOGS_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
          GITHUB_ACTIONS: 'true'
          TIMEZONE: ${{ secrets.TIMEZONE || vars.TIMEZONE || 'Europe/Madrid' }}
          GENERATE_JSON_OUTPUT: ${{ secrets.GENERATE_JSON_OUTPUT || vars.GENERATE_JSON_OUTPUT || 'false' }}
        run: |
          xvfb-run -a python Poly-Duel-Arb-Workflow.py || true

      - name: Parse Run Status
        if: steps.check_skip.outputs.should_skip != 'true'
        id: parse_status
        run: |
          python - <<'PY'
          import json, os
          p = 'run_status.json'
          if not os.path.exists(p):
              status, reason = 'unknown', 'no_status_file'
          else:
              try:
                  d = json.load(open(p))
                  status = str(d.get('status') or 'unknown')
                  reason = str(d.get('reason') or 'none')
              except Exception:
                  status, reason = 'unknown', 'parse_error'
          print(f'status={status}')
          print(f'reason={reason}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'status={status}\nreason={reason}\n')
          PY

      - name: Encrypt & Save Persistent Cache
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            if [ -f worker_data.json ]; then
              gpg --quiet --batch --yes --symmetric --passphrase "$GPG_PASSPHRASE" \
              --output worker_data.json.gpg worker_data.json
              echo "✅ Encrypted worker_data.json"
            fi
            if [ -d playwright_user_data ]; then
              zip -rq playwright_user_data.zip playwright_user_data
              gpg --quiet --batch --yes --symmetric --passphrase "$GPG_PASSPHRASE" \
              --output playwright_user_data.zip.gpg playwright_user_data.zip
              echo "✅ Encrypted browser profile"
            fi
          fi

      - name: Save Cache
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            worker_data.json.gpg
            playwright_user_data.zip.gpg
          key: persistent-poly-duel-${{ github.run_number }}

      - name: Cleanup Old Caches
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/caches > caches.json || true
          if [ -f caches.json ]; then
            jq -r '.actions_caches[]? | select((.created_at | split(".")[0] + "Z" | fromdateiso8601) < (now - 172800)) | .id' caches.json | tr -d '\r' | while read cache_id; do
              if [ -n "$cache_id" ]; then
                gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/caches/$cache_id || true
              fi
            done
          fi

      - name: Discord Notification on Handoff / Error
        if: always() && steps.check_skip.outputs.should_skip != 'true'
        continue-on-error: true
        env:
          LOGS_WEBHOOK_URL: ${{ secrets.LOGS_WEBHOOK_URL || vars.LOGS_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ steps.parse_status.outputs.status }}
          REASON: ${{ steps.parse_status.outputs.reason }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, requests
          url = os.environ.get('LOGS_WEBHOOK_URL', '').strip()
          if not url: exit(0)
          status = os.environ.get('STATUS', 'unknown')
          reason = os.environ.get('REASON', 'none')
          run_num = os.environ.get('RUN_NUM', '?')
          msg = f"🔄 **Poly-Duel 24/7 Pre-Match Worker #{run_num}** Handoff: Status: `{status}` | Reason: `{reason}`"
          try:
              requests.post(url, json={"content": msg}, timeout=8)
          except Exception: pass
          PY

      - name: Trigger Next Run (24/7 Perpetual Auto-Chaining)
        if: always() && steps.check_skip.outputs.should_skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
          WORKFLOW_FILE: 'poly-duel-arb.yml'
        run: |
          echo "🔄 Preparing next continuous 24/7 run..."
          sleep 10

          target_workflow="${WORKFLOW_FILE}"
          if [ -n "$GITHUB_WORKFLOW_REF" ]; then
            extracted=$(echo "$GITHUB_WORKFLOW_REF" | sed -e 's|.*\.github/workflows/||' -e 's|@.*||')
            if [ -n "$extracted" ]; then
              target_workflow="$extracted"
            fi
          fi

          dispatched=false
          if command -v gh >/dev/null 2>&1; then
            echo "Attempting dispatch via gh CLI for $target_workflow..."
            if gh workflow run "$target_workflow" --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}"; then
              echo "✅ Next run successfully dispatched via gh CLI!"
              dispatched=true
            fi
          fi

          if [ "$dispatched" != "true" ] && [ -n "$GH_TOKEN" ]; then
            echo "Attempting dispatch via GitHub REST API..."
            url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${target_workflow}/dispatches"
            ref="${GITHUB_REF_NAME:-main}"
            resp=$(curl -s -w "%{http_code}" -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" -d "{\"ref\":\"$ref\"}")
            if [ "$resp" = "204" ]; then
              echo "✅ Next run successfully dispatched via GitHub REST API (HTTP 204)!"
              dispatched=true
            else
              echo "⚠️ REST API dispatch returned HTTP $resp (scheduled cron will trigger next run)."
            fi
          fi

          if [ "$dispatched" = "true" ]; then
            echo "🚀 24/7 Auto-chain active: Next worker will start immediately."
          fi
