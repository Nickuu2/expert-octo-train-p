name: Pre-Match Arb Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: poly-duel-arb-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate and Prepare Repository Target
        id: repo_prep
        env:
          RAW_REPO: ${{ secrets.PRIVATE_REPO_NAME || vars.PRIVATE_REPO_NAME }}
          HAS_TOKEN: ${{ (secrets.PRIVATE_REPO_TOKEN != '' || vars.PRIVATE_REPO_TOKEN != '') && 'true' || 'false' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ -n "$RAW_REPO" ]; then
            CLEAN_REPO=$(echo "$RAW_REPO" | sed -e 's|https://github.com/||g' -e 's|http://github.com/||g' -e 's|\.git$||g' -e 's|^/||g' -e 's|/$||g')
            echo "target_repo=$CLEAN_REPO" >> $GITHUB_OUTPUT
            echo "use_custom_repo=true" >> $GITHUB_OUTPUT
            echo "✅ Configured to checkout repository: $CLEAN_REPO"
          else
            echo "target_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "use_custom_repo=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Using default repository checkout: ${{ github.repository }}"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_prep.outputs.target_repo }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || vars.PRIVATE_REPO_TOKEN || github.token }}

      - name: Verify Target Repository & Script Presence
        run: |
          if [ ! -f "Poly-Duel-Arb-Workflow.py" ]; then
            echo "::error::❌ Poly-Duel-Arb-Workflow.py was NOT found in repository '${{ steps.repo_prep.outputs.target_repo }}'!"
            echo "Listing files in checked-out directory:"
            ls -la
            exit 1
          fi
          if [ ! -d "market_mappers" ]; then
            echo "::error::❌ 'market_mappers' folder was NOT found in repository '${{ steps.repo_prep.outputs.target_repo }}'! The engine requires the market_mappers folder for sports mapping."
            echo "Listing files in checked-out directory:"
            ls -la
            exit 1
          fi
          echo "✅ Poly-Duel-Arb-Workflow.py and market_mappers/ successfully verified in target repository."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright playwright-stealth python-dotenv requests pyotp python-dateutil tzdata aiohttp py-clob-client
          fi
          python -m playwright install --with-deps chromium

      - name: Check Skip Job
        id: check_skip
        env:
          SKIP_JOB_ENV: ${{ secrets.SKIP_JOB || vars.SKIP_JOB }}
        run: |
          should_skip="false"
          if [ -f .env.poly_duel ]; then
            if grep -q "SKIP_JOB=true" .env.poly_duel; then
              should_skip="true"
            fi
          elif [ -f .env ]; then
            if grep -q "SKIP_JOB=true" .env; then
              should_skip="true"
            fi
          fi
          if [ "$SKIP_JOB_ENV" == "true" ]; then
            should_skip="true"
          fi
          echo "should_skip=$should_skip" >> $GITHUB_OUTPUT
          if [ "$should_skip" == "true" ]; then
            echo "⚠️ Job is configured to be skipped."
          fi

      - name: Restore & Decrypt Persistent Data & Profile Cache
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            poly_duel_data.json.gpg
            playwright_duel_data.zip.gpg
          key: persistent-poly-duel-${{ github.run_number }}
          restore-keys: |
            persistent-poly-duel-

      - name: Decrypt Persistent Data
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            if [ -f poly_duel_data.json.gpg ]; then
              gpg --quiet --batch --yes --decrypt --passphrase "$GPG_PASSPHRASE" \
              --output poly_duel_data.json poly_duel_data.json.gpg || true
              echo "✅ Decrypted persistent poly_duel_data.json"
            fi
            if [ -f playwright_duel_data.zip.gpg ]; then
              gpg --quiet --batch --yes --decrypt --passphrase "$GPG_PASSPHRASE" \
              --output playwright_duel_data.zip playwright_duel_data.zip.gpg || true
              if [ -f playwright_duel_data.zip ]; then
                unzip -q -o playwright_duel_data.zip || true
                echo "✅ Decrypted and restored Duel browser profile"
              fi
            fi
          fi

      - name: Write .env.poly_duel from secret if configured
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          ENV_POLY_DUEL_SECRET: ${{ secrets.ENV_POLY_DUEL || secrets.POLY_DUEL_ENV || '' }}
        run: |
          if [ -n "$ENV_POLY_DUEL_SECRET" ]; then
            echo "$ENV_POLY_DUEL_SECRET" > .env.poly_duel
            echo "✅ Written .env.poly_duel from repository secret"
          fi

      - name: Run Poly-Duel Pre-Match Arbitrage Engine
        if: steps.check_skip.outputs.should_skip != 'true'
        id: run_engine
        env:
          EXECUTION_MODE: ${{ secrets.EXECUTION_MODE || vars.EXECUTION_MODE || '' }}
          TESTING: ${{ secrets.TESTING != '' && (secrets.TESTING || vars.TESTING) || '' }}
          HEADLESS_MODE: ${{ secrets.HEADLESS_MODE != '' && (secrets.HEADLESS_MODE || vars.HEADLESS_MODE) || 'false' }}
          MAX_RUNTIME_HOURS: ${{ secrets.MAX_RUNTIME_HOURS || vars.MAX_RUNTIME_HOURS || '' }}
          SCAN_INTERVAL_SECONDS: ${{ secrets.SCAN_INTERVAL_SECONDS || vars.SCAN_INTERVAL_SECONDS || '' }}
          SILENT_SCAN: ${{ secrets.SILENT_SCAN != '' && (secrets.SILENT_SCAN || vars.SILENT_SCAN) || '' }}
          MIN_ARB_THRESHOLD: ${{ secrets.MIN_ARB_THRESHOLD || vars.MIN_ARB_THRESHOLD || '' }}
          MAX_ARB_THRESHOLD: ${{ secrets.MAX_ARB_THRESHOLD || vars.MAX_ARB_THRESHOLD || '' }}
          MAX_ODDS_AGE_SECONDS: ${{ secrets.MAX_ODDS_AGE_SECONDS || vars.MAX_ODDS_AGE_SECONDS || '' }}
          ARB_COOLDOWN_SECONDS: ${{ secrets.ARB_COOLDOWN_SECONDS || vars.ARB_COOLDOWN_SECONDS || '' }}
          TOTAL_STAKE_AMOUNT: ${{ secrets.TOTAL_STAKE_AMOUNT || vars.TOTAL_STAKE_AMOUNT || '' }}
          MIN_BALANCE: ${{ secrets.MIN_BALANCE || vars.MIN_BALANCE || '' }}
          SIMULATE_BET_PLACEMENT: ${{ secrets.SIMULATE_BET_PLACEMENT != '' && (secrets.SIMULATE_BET_PLACEMENT || vars.SIMULATE_BET_PLACEMENT) || '' }}
          # Duel Credentials & 2FA
          DUEL_USERNAME: ${{ secrets.DUEL_USERNAME || secrets.SITE_USERNAME || vars.DUEL_USERNAME || vars.SITE_USERNAME }}
          DUEL_PASSWORD: ${{ secrets.DUEL_PASSWORD || secrets.SITE_PASSWORD || vars.DUEL_PASSWORD || vars.SITE_PASSWORD }}
          DUEL_AUTH_SECRET: ${{ secrets.DUEL_AUTH_SECRET || secrets.GOOGLE_AUTH_SECRET || vars.DUEL_AUTH_SECRET || vars.GOOGLE_AUTH_SECRET }}
          DUEL_BRAND_ID: ${{ secrets.DUEL_BRAND_ID || vars.DUEL_BRAND_ID || '' }}
          DUEL_SPORTS_URL: ${{ secrets.DUEL_SPORTS_URL || vars.DUEL_SPORTS_URL || '' }}
          DUEL_CURRENCY: ${{ secrets.DUEL_CURRENCY || vars.DUEL_CURRENCY || '' }}
          # Polymarket Credentials & CLOB Key
          POLY_HOST: ${{ secrets.POLY_HOST || vars.POLY_HOST || '' }}
          POLY_GAMMA_API: ${{ secrets.POLY_GAMMA_API || vars.POLY_GAMMA_API || '' }}
          POLY_CHAIN_ID: ${{ secrets.POLY_CHAIN_ID || vars.POLY_CHAIN_ID || '' }}
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY || secrets.PK || vars.POLY_PRIVATE_KEY || vars.PK }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER || secrets.POLY_ADDRESS || vars.POLY_FUNDER || vars.POLY_ADDRESS }}
          POLY_API_KEY: ${{ secrets.POLY_API_KEY || vars.POLY_API_KEY }}
          POLY_API_SECRET: ${{ secrets.POLY_API_SECRET || vars.POLY_API_SECRET }}
          POLY_PASSPHRASE: ${{ secrets.POLY_PASSPHRASE || vars.POLY_PASSPHRASE }}
          # Proxy settings (Supports both repository Secrets and Variables)
          USE_PROXY: ${{ secrets.USE_PROXY || vars.USE_PROXY || '' }}
          PROXY_IP: ${{ secrets.PROXY_IP || vars.PROXY_IP }}
          PROXY_PORT: ${{ secrets.PROXY_PORT || vars.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME || vars.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD || vars.PROXY_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL || vars.PROXY_URL }}
          # Notifications, Output Logs & Timezone
          ENABLE_CONSOLE_LOGS: ${{ secrets.ENABLE_CONSOLE_LOGS != '' && (secrets.ENABLE_CONSOLE_LOGS || vars.ENABLE_CONSOLE_LOGS) || '' }}
          ENABLE_DISCORD_ALERTS: ${{ secrets.ENABLE_DISCORD_ALERTS != '' && (secrets.ENABLE_DISCORD_ALERTS || vars.ENABLE_DISCORD_ALERTS) || '' }}
          LOGS_WEBHOOK_URL1: ${{ secrets.LOGS_WEBHOOK_URL1 || vars.LOGS_WEBHOOK_URL1 || secrets.GH_SECRETS_LOGS_WEBHOOK_URL1 || vars.GH_VARS_LOGS_WEBHOOK_URL1 || secrets.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
          GITHUB_ACTIONS: 'true'
          TIMEZONE: ${{ secrets.TIMEZONE || vars.TIMEZONE || '' }}
          GENERATE_JSON_OUTPUT: ${{ secrets.GENERATE_JSON_OUTPUT != '' && (secrets.GENERATE_JSON_OUTPUT || vars.GENERATE_JSON_OUTPUT) || '' }}
        run: |
          echo "🚀 Executing Poly-Duel Pre-Match Arbitrage Engine..."
          xvfb-run -a python Poly-Duel-Arb-Workflow.py || true

      - name: Parse Run Status
        if: steps.check_skip.outputs.should_skip != 'true'
        id: parse_status
        run: |
          python - <<'PY'
          import json, os
          p = 'run_status.json'
          if not os.path.exists(p):
              status, reason = 'unknown', 'no_status_file'
          else:
              try:
                  d = json.load(open(p))
                  status = str(d.get('status') or 'unknown')
                  reason = str(d.get('reason') or 'none')
              except Exception:
                  status, reason = 'unknown', 'parse_error'
          print(f'status={status}')
          print(f'reason={reason}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'status={status}\nreason={reason}\n')
          PY

      - name: Encrypt & Save Persistent Cache
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            if [ -f poly_duel_data.json ]; then
              gpg --quiet --batch --yes --symmetric --passphrase "$GPG_PASSPHRASE" \
              --output poly_duel_data.json.gpg poly_duel_data.json
              echo "✅ Encrypted persistent poly_duel_data.json"
            fi
            if [ -d playwright_duel_data ]; then
              zip -rq playwright_duel_data.zip playwright_duel_data
              gpg --quiet --batch --yes --symmetric --passphrase "$GPG_PASSPHRASE" \
              --output playwright_duel_data.zip.gpg playwright_duel_data.zip
              echo "✅ Encrypted Duel browser profile"
            fi
          fi

      - name: Save Cache
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            poly_duel_data.json.gpg
            playwright_duel_data.zip.gpg
          key: persistent-poly-duel-${{ github.run_number }}

      - name: Cleanup Old Caches
        if: steps.check_skip.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/caches > caches.json || true
          if [ -f caches.json ]; then
            jq -r '.actions_caches[]? | select((.created_at | split(".")[0] + "Z" | fromdateiso8601) < (now - 172800)) | .id' caches.json | tr -d '\r' | while read cache_id; do
              if [ -n "$cache_id" ]; then
                gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/caches/$cache_id || true
              fi
            done
          fi

      - name: Log run outcome to Discord
        if: always() && steps.check_skip.outputs.should_skip != 'true'
        continue-on-error: true
        env:
          LOGS_WEBHOOK_URL1: ${{ secrets.LOGS_WEBHOOK_URL1 || vars.LOGS_WEBHOOK_URL1 || secrets.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL }}
          RUN_STATUS: ${{ steps.parse_status.outputs.status }}
          RUN_REASON: ${{ steps.parse_status.outputs.reason }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os, requests
          url = os.environ.get('LOGS_WEBHOOK_URL1', '').strip()
          for ef in ('.env.poly_duel', '.env.poly', '.env'):
              if not url and os.path.exists(ef):
                  try:
                      from dotenv import dotenv_values
                      d = dotenv_values(ef)
                      url = (d.get('LOGS_WEBHOOK_URL1') or d.get('LOGS_WEBHOOK_URL') or d.get('DISCORD_WEBHOOK_URL') or '').strip()
                  except Exception:
                      pass
          if not url:
              exit(0)
          status = os.environ.get('RUN_STATUS', 'unknown').strip()
          reason = os.environ.get('RUN_REASON', 'unknown').strip()
          run_num = os.environ.get('RUN_NUMBER', '?').strip()
          job_status = os.environ.get('JOB_STATUS', 'unknown').strip()

          if job_status not in ('success', 'cancelled'):
              icon = '🔴'
              msg = f'{icon} Poly-Duel Run #{run_num} — WORKFLOW ERROR | Status: {status} | Reason: {reason}'
          elif status == 'completed':
              icon = '✅'
              msg = f'{icon} Poly-Duel Run #{run_num} completed 4.5h cycle successfully. Handoff to next worker.'
          else:
              icon = 'ℹ️'
              msg = f'{icon} Poly-Duel Run #{run_num} finished | Status: {status} | Reason: {reason}'

          try:
              requests.post(url, json={'content': msg}, timeout=10)
          except Exception:
              pass
          PY

      - name: Trigger Next Run (24/7 Perpetual Auto-Chaining)
        if: always() && steps.check_skip.outputs.should_skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
          WORKFLOW_FILE: 'poly-duel-arb.yml'
        run: |
          echo "🔄 Preparing next continuous 24/7 run..."
          sleep 15

          # Detect actual workflow file name if available
          target_workflow="${WORKFLOW_FILE}"
          if [ -n "$GITHUB_WORKFLOW_REF" ]; then
            extracted=$(echo "$GITHUB_WORKFLOW_REF" | sed -e 's|.*\.github/workflows/||' -e 's|@.*||')
            if [ -n "$extracted" ]; then
              target_workflow="$extracted"
            fi
          fi
          if [ -z "$target_workflow" ]; then
            target_workflow="poly-duel-arb.yml"
          fi

          dispatched=false
          # Attempt dispatch via gh CLI first
          if command -v gh >/dev/null 2>&1; then
            echo "Attempting dispatch via gh CLI for $target_workflow..."
            if gh workflow run "$target_workflow" --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}"; then
              echo "✅ Next run successfully dispatched via gh CLI!"
              dispatched=true
            fi
          fi

          # Fallback to direct GitHub REST API if gh CLI did not dispatch
          if [ "$dispatched" != "true" ] && [ -n "$GH_TOKEN" ]; then
            echo "Attempting dispatch via GitHub REST API..."
            url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${target_workflow}/dispatches"
            ref="${GITHUB_REF_NAME:-main}"
            resp=$(curl -s -w "%{http_code}" -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" -d "{\"ref\":\"$ref\"}")
            if [ "$resp" = "204" ]; then
              echo "✅ Next run successfully dispatched via GitHub REST API (HTTP 204)!"
              dispatched=true
            else
              echo "⚠️ REST API dispatch returned HTTP $resp (scheduled cron will trigger next run)."
            fi
          fi

          if [ "$dispatched" = "true" ]; then
            echo "🚀 24/7 Auto-chain active: Next worker will start immediately."
          fi
