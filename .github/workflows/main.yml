name: Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-service-worker
  cancel-in-progress: false

jobs:
  run-linux:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate and Prepare Repository Target
        id: repo_prep
        env:
          RAW_REPO: ${{ secrets.PRIVATE_REPO_NAME || vars.PRIVATE_REPO_NAME }}
          HAS_TOKEN: ${{ (secrets.PRIVATE_REPO_TOKEN != '' || vars.PRIVATE_REPO_TOKEN != '') && 'true' || 'false' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::❌ PRIVATE_REPO_TOKEN secret is missing! Please configure PRIVATE_REPO_TOKEN with your GitHub PAT."
            exit 1
          fi
          if [ -z "$RAW_REPO" ]; then
            echo "::error::❌ PRIVATE_REPO_NAME is missing! Please configure PRIVATE_REPO_NAME with format 'owner/repo-name'."
            exit 1
          fi
          CLEAN_REPO=$(echo "$RAW_REPO" | sed -e 's|https://github.com/||g' -e 's|http://github.com/||g' -e 's|\.git$||g' -e 's|^/||g' -e 's|/$||g')
          echo "target_repo=$CLEAN_REPO" >> $GITHUB_OUTPUT
          echo "✅ Configured to checkout repository: $CLEAN_REPO"

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_prep.outputs.target_repo }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || vars.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright playwright-stealth python-dotenv requests pyotp python-dateutil tzdata py-clob-client aiohttp psutil
          fi
          python -m playwright install --with-deps chromium

      - name: Check Skip Job
        id: check_skip
        env:
          SKIP_JOB_ENV: ${{ secrets.SKIP_JOB || vars.SKIP_JOB }}
        run: |
          should_skip="false"
          if [ -f .env ]; then
            if grep -q "SKIP_JOB=true" .env; then
              should_skip="true"
            fi
          fi
          if [ "$SKIP_JOB_ENV" == "true" ]; then
            should_skip="true"
          fi
          echo "should_skip=$should_skip" >> $GITHUB_OUTPUT
          if [ "$should_skip" == "true" ]; then
            echo "⚠️ Job is configured to be skipped."
          fi

      - name: Check pause window
        if: steps.check_skip.outputs.should_skip != 'true'
        id: checkpause
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, requests
          def get_var(token, owner, repo, name):
              url = f"https://api.github.com/repos/{owner}/{repo}/actions/variables/{name}"
              r = requests.get(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
              if r.status_code == 200:
                  return r.json().get('value')
              return None
          token = os.environ.get('GH_TOKEN', '')
          repo_full = os.environ.get('GITHUB_REPOSITORY', '')
          if token and '/' in repo_full:
              owner, repo = repo_full.split('/')
              v = get_var(token, owner, repo, 'PAUSE_UNTIL')
              now = int(time.time())
              paused = 'false'
              try:
                  if v and int(v) > now:
                      paused = 'true'
              except Exception:
                  paused = 'false'
          else:
              paused = 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'paused={paused}\n')
          PY

      - name: Write auth_state.json from secret
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        env:
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
        run: |
          if [ -n "$AUTH_STATE_JSON" ]; then
            echo "$AUTH_STATE_JSON" > auth_state.json
          fi

      - name: Restore & Decrypt Persistent Data & Profile Cache
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            worker_data.json.gpg
            playwright_user_data.zip.gpg
          key: persistent-data-sync-${{ github.run_number }}
          restore-keys: |
            persistent-data-sync-
            persistent-data-worker-

      - name: Decrypt Data
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            if [ -f worker_data.json.gpg ]; then
              gpg --quiet --batch --yes --decrypt --passphrase "$GPG_PASSPHRASE" \
              --output worker_data.json worker_data.json.gpg
              echo "✅ Decrypted persistent worker_data.json"
            fi
            if [ -f playwright_user_data.zip.gpg ]; then
              gpg --quiet --batch --yes --decrypt --passphrase "$GPG_PASSPHRASE" \
              --output playwright_user_data.zip playwright_user_data.zip.gpg
              unzip -q -o playwright_user_data.zip
              echo "✅ Decrypted and restored browser profile"
            fi
          fi
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run Worker Service
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        id: run_worker
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY || secrets.PRIVATE_KEY || secrets.PK || '' }}
          POLY_API_KEY: ${{ secrets.POLY_API_KEY || secrets.API_KEY || '' }}
          POLY_API_SECRET: ${{ secrets.POLY_API_SECRET || secrets.API_SECRET || '' }}
          POLY_PASSPHRASE: ${{ secrets.POLY_PASSPHRASE || secrets.PASSPHRASE || '' }}
          POLY_BUILDER_CODE: ${{ secrets.POLY_BUILDER_CODE || vars.POLY_BUILDER_CODE || '' }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER || secrets.POLY_ADDRESS || secrets.FUNDER_ADDRESS || '' }}
          POLY_SIGNATURE_TYPE: ${{ secrets.POLY_SIGNATURE_TYPE || vars.POLY_SIGNATURE_TYPE || '3' }}
          USE_PROXY: ${{ secrets.USE_PROXY || vars.USE_PROXY || 'true' }}
          PROXY_IP: ${{ secrets.PROXY_IP }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          SUREBET_URL: ${{ secrets.SUREBET_URL || vars.SUREBET_URL || '' }}
          SUREBET_RELOAD_INTERVAL: ${{ secrets.SUREBET_RELOAD_INTERVAL || vars.SUREBET_RELOAD_INTERVAL || '25' }}
          SUREBET_USERNAME: ${{ secrets.SITE_USERNAME || secrets.SUREBET_USERNAME || '' }}
          SUREBET_PASSWORD: ${{ secrets.SITE_PASSWORD || secrets.SUREBET_PASSWORD || '' }}
          INITIAL_BANKROLL: ${{ secrets.INITIAL_BANKROLL || vars.INITIAL_BANKROLL || '34' }}
          BASE_STAKE: ${{ secrets.BASE_STAKE || vars.BASE_STAKE || '1' }}
          TIER_2_THRESHOLD: ${{ secrets.TIER_2_THRESHOLD || vars.TIER_2_THRESHOLD || '333.0' }}
          TIER_2_BASE_STAKE: ${{ secrets.TIER_2_BASE_STAKE || vars.TIER_2_BASE_STAKE || '10' }}
          MIN_OVERVALUE: ${{ secrets.MIN_OVERVALUE || vars.MIN_OVERVALUE || '' }}
          MIN_ODDS: ${{ secrets.MIN_ODDS || vars.MIN_ODDS || '' }}
          MAX_ODDS: ${{ secrets.MAX_ODDS || vars.MAX_ODDS || '' }}
          ODDS_TOLERANCE_PCT: ${{ secrets.ODDS_TOLERANCE_PCT || vars.ODDS_TOLERANCE_PCT || '0.0' }}
          MAX_RUNTIME_HOURS: ${{ secrets.MAX_RUNTIME_HOURS || vars.MAX_RUNTIME_HOURS || '5.0' }}
          TESTING: ${{ secrets.TESTING || vars.TESTING || 'false' }}
          LOGS_WEBHOOK_URL: ${{ secrets.LOGS_WEBHOOK_URL || vars.LOGS_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL || secrets.WEBHOOK_URL || '' }}
          GH_SECRETS_LOGS_WEBHOOK_URL: ${{ secrets.LOGS_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL || secrets.WEBHOOK_URL || '' }}
          GH_VARS_LOGS_WEBHOOK_URL: ${{ vars.LOGS_WEBHOOK_URL || '' }}
          ENABLE_DISCORD_LOGS: ${{ secrets.ENABLE_DISCORD_LOGS != '' && secrets.ENABLE_DISCORD_LOGS || vars.ENABLE_DISCORD_LOGS || '' }}
          ENABLE_CONSOLE_LOGS: ${{ secrets.ENABLE_CONSOLE_LOGS != '' && secrets.ENABLE_CONSOLE_LOGS || vars.ENABLE_CONSOLE_LOGS || '' }}
          GH_SECRETS_ENABLE_CONSOLE_LOGS: ${{ secrets.ENABLE_CONSOLE_LOGS || '' }}
          GH_VARS_ENABLE_CONSOLE_LOGS: ${{ vars.ENABLE_CONSOLE_LOGS || '' }}
          HEADLESS_MODE: 'true'
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
          GITHUB_ACTIONS: 'true'
        run: |
          TARGET_SCRIPT="${WORKER_SCRIPT:-$(find . -maxdepth 1 -name '*Workflow.py' -o -name '*worker*.py' -o -name 'main.py' | head -n 1)}"
          if [ -z "$TARGET_SCRIPT" ] || [ ! -f "$TARGET_SCRIPT" ]; then
            TARGET_SCRIPT=$(find . -maxdepth 1 -name "*.py" ! -name "test*" | head -n 1)
          fi
          echo "Executing target script: $TARGET_SCRIPT"
          xvfb-run -a python "$TARGET_SCRIPT" || true

      - name: Parse run status
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        id: parse
        run: |
          python - <<'PY'
          import json, os
          p = 'run_status.json'
          if not os.path.exists(p):
              status, reason, wait_hours = 'none', 'none', '0'
          else:
              try:
                  d = json.load(open(p))
                  status = str(d.get('status') or 'none')
                  reason = str(d.get('reason') or 'none')
                  wait_hours = str(d.get('wait_hours') or 0)
              except Exception:
                  status, reason, wait_hours = 'none', 'none', '0'
          print(f'status={status}')
          print(f'reason={reason}')
          print(f'wait_hours={wait_hours}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'status={status}\nreason={reason}\nwait_hours={wait_hours}\n')
          PY

      - name: Encrypt & Save Cache
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        id: encrypt_cache
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            if [ -f worker_data.json ]; then
              gpg --quiet --batch --yes --symmetric --passphrase "$GPG_PASSPHRASE" \
              --output worker_data.json.gpg worker_data.json
              echo "✅ Encrypted worker_data.json"
            fi
            if [ -d playwright_user_data ]; then
              if command -v zip >/dev/null 2>&1; then
                zip -rq playwright_user_data.zip playwright_user_data
              else
                python -c "import zipfile, pathlib; src = pathlib.Path('playwright_user_data'); zf = zipfile.ZipFile('playwright_user_data.zip', 'w', zipfile.ZIP_DEFLATED); [zf.write(f, f.relative_to(src.parent)) for f in src.rglob('*') if f.is_file()]; zf.close()"
              fi
              echo "✅ Profile zipped"
              gpg --quiet --batch --yes --symmetric --passphrase "$GPG_PASSPHRASE" \
              --output playwright_user_data.zip.gpg playwright_user_data.zip
              echo "✅ Encrypted browser profile"
            fi
          fi

      - name: Save Cache
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            worker_data.json.gpg
            playwright_user_data.zip.gpg
          key: persistent-data-sync-${{ github.run_number }}

      - name: Cleanup Old Caches
        if: steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/caches > caches.json || true
          if [ -f caches.json ]; then
            jq -r '.actions_caches[]? | select((.created_at | split(".")[0] + "Z" | fromdateiso8601) < (now - 172800)) | .id' caches.json | tr -d '\r' | while read cache_id; do
              if [ -n "$cache_id" ]; then
                gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/caches/$cache_id || true
              fi
            done
          fi

      - name: Log run outcome to Discord
        if: always() && steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        continue-on-error: true
        env:
          LOGS_WEBHOOK_URL: ${{ secrets.LOGS_WEBHOOK_URL || vars.LOGS_WEBHOOK_URL || '' }}
          RUN_STATUS: ${{ steps.parse.outputs.status }}
          RUN_REASON: ${{ steps.parse.outputs.reason }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os, requests
          url = os.environ.get('LOGS_WEBHOOK_URL', '').strip()
          if not url and os.path.exists('.env'):
              try:
                  from dotenv import dotenv_values
                  url = (dotenv_values('.env').get('LOGS_WEBHOOK_URL') or '').strip()
              except Exception:
                  pass
          if not url:
              exit(0)
          status = os.environ.get('RUN_STATUS', 'unknown').strip()
          reason = os.environ.get('RUN_REASON', 'unknown').strip()
          run_num = os.environ.get('RUN_NUMBER', '?').strip()
          job_status = os.environ.get('JOB_STATUS', 'unknown').strip()
          
          if job_status not in ('success', 'cancelled'):
              icon = '🔴'
              msg = f'{icon} Worker Run #{run_num} — WORKFLOW ERROR | Status: {status} | Reason: {reason}'
          elif status == 'completed':
              icon = '✅'
              msg = f'{icon} Worker Run #{run_num} completed successfully.'
          else:
              icon = 'ℹ️'
              msg = f'{icon} Worker Run #{run_num} finished | Status: {status} | Reason: {reason}'
          
          try:
              requests.post(url, json={'content': msg}, timeout=10)
          except Exception:
              pass
          PY

      - name: Trigger Next Run (24/7 Perpetual Auto-Chaining)
        if: always() && steps.check_skip.outputs.should_skip != 'true' && steps.checkpause.outputs.paused != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
          WORKFLOW_FILE: ${{ secrets.WORKFLOW_FILE || vars.WORKFLOW_FILE || '' }}
        run: |
          echo "🔄 Preparing next continuous 24/7 run for Worker..."
          sleep 15

          target_workflow="${WORKFLOW_FILE}"
          if [ -z "$target_workflow" ] && [ -n "$GITHUB_WORKFLOW_REF" ]; then
            extracted=$(echo "$GITHUB_WORKFLOW_REF" | sed -e 's|.*\.github/workflows/||' -e 's|@.*||')
            if [ -n "$extracted" ]; then
              target_workflow="$extracted"
            fi
          fi
          if [ -z "$target_workflow" ]; then
            target_workflow="${GITHUB_WORKFLOW:-worker.yml}"
          fi

          dispatched=false
          if command -v gh >/dev/null 2>&1; then
            echo "Attempting dispatch via gh CLI for $target_workflow..."
            if gh workflow run "$target_workflow" --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}"; then
              echo "✅ Next run successfully dispatched via gh CLI!"
              dispatched=true
            fi
          fi

          if [ "$dispatched" != "true" ] && [ -n "$GH_TOKEN" ]; then
            echo "Attempting dispatch via GitHub REST API..."
            url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${target_workflow}/dispatches"
            ref="${GITHUB_REF_NAME:-main}"
            resp=$(curl -s -w "%{http_code}" -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" -d "{\"ref\":\"$ref\"}")
            if [ "$resp" = "204" ]; then
              echo "✅ Next run successfully dispatched via GitHub REST API (HTTP 204)!"
              dispatched=true
            else
              echo "⚠️ REST API dispatch returned HTTP $resp (scheduled cron will trigger next run)."
            fi
          fi

          if [ "$dispatched" = "true" ]; then
            echo "🚀 24/7 Auto-chain active: Next worker will start immediately."
          fi
